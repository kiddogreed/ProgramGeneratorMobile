name: church_program_generator
description: Church Program Generator - Mobile App for LDS meeting programs
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # JSON serialization
  # (we use dart:convert directly; no code-gen needed)

  # PDF generation & sharing
  pdf: ^3.11.1
  printing: ^5.13.1

  # Share via Android share menu
  share_plus: ^12.0.2

  # Date formatting
  intl: ^0.19.0

  # Material icons & cupertino
  cupertino_icons: ^1.0.8

  # PNG / screenshot export
  screenshot: ^3.0.0

  # DOCX export (create .docx as ZIP/XML)
  archive: ^4.0.0

  # File picker for logo
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/LDS_LOGO.png
    - assets/images/P3_LOGO.png
